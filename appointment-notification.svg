<svg viewBox="0 0 260 80" xmlns="http://www.w3.org/2000/svg">
  <!-- White background with rounded corners -->
  <rect x="0" y="0" width="260" height="80" rx="6" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
  
  <!-- Icon and title on same line -->
  <g>
    <!-- Calendar icon background -->
    <rect x="10" y="10" width="32" height="32" rx="6" fill="#1B75BB"/>
    
    <!-- Calendar icon -->
    <g transform="translate(17, 16)">
      <!-- Calendar body -->
      <rect x="0" y="5" width="18" height="14" rx="1" fill="none" stroke="white" stroke-width="1.5"/>
      <!-- Calendar hangers -->
      <line x1="4" y1="1" x2="4" y2="8" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="14" y1="1" x2="14" y2="8" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
      <!-- Calendar grid line -->
      <line x1="0" y1="10" x2="18" y2="10" stroke="white" stroke-width="1"/>
    </g>
    
    <!-- Title text -->
    <text x="48" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="16" font-weight="600" fill="#1B75BB">New Appointment</text>
  </g>
  
  <!-- Booking details text -->
  <text x="10" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" fill="#6b7280">
    Sarah J. • Nov 15, 2024 @ 2:30 PM
  </text>
</svg>