<svg viewBox="0 0 1400 250" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1400" height="250" fill="#f5f5f5"/>
  
  <!-- Google Business Profile Icon -->
  <g transform="translate(50, 40)">
    <!-- Icon background circle -->
    <circle cx="35" cy="35" r="35" fill="#e8eaf6"/>
    
    <!-- Google G -->
    <text x="35" y="52" font-family="Arial, sans-serif" font-size="40" font-weight="500" fill="#4285f4" text-anchor="middle">G</text>
  </g>
  
  <!-- Title -->
  <text x="140" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="36" font-weight="600" fill="#333333">
    GBP Score Optimization
  </text>
  
  <!-- Before label -->
  <g transform="translate(600, 60)">
    <rect x="0" y="0" width="120" height="50" rx="25" fill="#2c2c2c"/>
    <text x="60" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="20" font-weight="500" fill="#ffffff" text-anchor="middle">
      Before 6/15
    </text>
    <!-- Arrow pointing down -->
    <path d="M 60 50 L 50 65 L 70 65 Z" fill="#2c2c2c"/>
  </g>
  
  <!-- Now label -->
  <g transform="translate(1200, 60)">
    <rect x="0" y="0" width="140" height="50" rx="25" fill="#4caf50"/>
    <text x="70" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="20" font-weight="500" fill="#ffffff" text-anchor="middle">
      📈 Now 13/15
    </text>
    <!-- Arrow pointing down -->
    <path d="M 70 50 L 60 65 L 80 65 Z" fill="#4caf50"/>
  </g>
  
  <!-- Progress bar background -->
  <rect x="100" y="160" width="1200" height="30" rx="15" fill="#e0e0e0"/>
  
  <!-- Progress bar fill -->
  <!-- Before section (6/15 = 40%) -->
  <rect x="100" y="160" width="480" height="30" rx="15" fill="#2c2c2c"/>
  
  <!-- Now section (13/15 = 86.67%, so additional 46.67% = 560px) -->
  <rect x="580" y="160" width="560" height="30" rx="15" fill="#4caf50"/>
</svg>