<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="500" fill="#f5f5f5"/>
  
  <!-- Google Business Profile Card -->
  <g>
    <!-- Main card background -->
    <rect x="20" y="40" width="360" height="420" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
    
    <!-- Header section -->
    <rect x="20" y="40" width="360" height="60" rx="12" fill="#ffffff"/>
    
    <!-- Practice photo placeholder -->
    <rect x="35" y="55" width="80" height="60" rx="8" fill="#1B75BB"/>
    <text x="75" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="28" fill="#ffffff" text-anchor="middle">🏥</text>
    
    <!-- Practice info -->
    <text x="130" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="18" font-weight="600" fill="#1f2937">NeuroWellness Center</text>
    <text x="130" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="14" fill="#6b7280">Mental Health Clinic</text>
    
    <!-- Rating stars -->
    <g transform="translate(130, 95)">
      <text x="0" y="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="16" fill="#fbbf24">★★★★★</text>
      <text x="80" y="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="14" fill="#374151">4.9 (127 reviews)</text>
    </g>
  </g>
  
  <!-- Status and hours -->
  <g>
    <!-- Open status -->
    <circle cx="50" cy="140" r="4" fill="#10b981"/>
    <text x="60" y="145" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="14" font-weight="600" fill="#10b981">Open</text>
    <text x="100" y="145" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="14" fill="#6b7280">• Closes 6 PM</text>
    
    <!-- Contact info -->
    <text x="35" y="165" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="14" fill="#1B75BB">📞 (555) 123-4567</text>
    <text x="35" y="185" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="14" fill="#1B75BB">📍 123 Wellness Ave, Health City</text>
  </g>
  
  <!-- Action buttons -->
  <g>
    <!-- Call button -->
    <rect x="35" y="210" width="100" height="35" rx="18" fill="#1B75BB"/>
    <text x="85" y="232" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">Call</text>
    
    <!-- Directions button -->
    <rect x="150" y="210" width="100" height="35" rx="18" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
    <text x="200" y="232" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="14" font-weight="600" fill="#374151" text-anchor="middle">Directions</text>
    
    <!-- Book button -->
    <rect x="265" y="210" width="100" height="35" rx="18" fill="#10b981"/>
    <text x="315" y="232" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">Book Online</text>
  </g>
  
  <!-- Recent reviews section -->
  <g>
    <!-- Section header -->
    <text x="35" y="280" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="16" font-weight="600" fill="#1f2937">Recent Reviews</text>
    
    <!-- Review 1 -->
    <g transform="translate(35, 290)">
      <circle cx="15" cy="15" r="12" fill="#e5e7eb"/>
      <text x="15" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle">JS</text>
      <text x="35" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="14" font-weight="600" fill="#374151">Jennifer S.</text>
      <text x="35" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" fill="#fbbf24">★★★★★</text>
      <text x="110" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" fill="#6b7280">2 days ago</text>
      <text x="0" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" fill="#374151">"Exceptional care and very responsive staff..."</text>
    </g>
    
    <!-- Review 2 -->
    <g transform="translate(35, 345)">
      <circle cx="15" cy="15" r="12" fill="#e5e7eb"/>
      <text x="15" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle">MK</text>
      <text x="35" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="14" font-weight="600" fill="#374151">Michael K.</text>
      <text x="35" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" fill="#fbbf24">★★★★★</text>
      <text x="110" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" fill="#6b7280">1 week ago</text>
      <text x="0" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" fill="#374151">"Easy to book online and great follow-up care."</text>
    </g>
  </g>
  
  <!-- Google branding -->
  <g transform="translate(35, 420)">
    <text x="0" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="600" fill="#4285f4">Google</text>
    <text x="40" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" fill="#6b7280">Business Profile</text>
    
    <!-- Verification badge -->
    <circle cx="280" cy="10" r="8" fill="#10b981"/>
    <text x="280" y="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle">✓</text>
    <text x="295" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" fill="#10b981">Verified</text>
  </g>
  
  <!-- Bottom tagline -->
  <text x="200" y="480" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="14" fill="#1B75BB" text-anchor="middle" font-weight="600">Optimized • Verified • Trusted</text>
</svg>