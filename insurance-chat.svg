<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="500" fill="#f5f5f5"/>
  
  <!-- First message bubble (patient) -->
  <g>
    <!-- User avatar -->
    <rect x="20" y="20" width="50" height="50" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
    <text x="45" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="24" font-weight="600" fill="#3d3d70" text-anchor="middle">MK</text>
    
    <!-- Message background -->
    <rect x="80" y="20" width="300" height="80" rx="15" fill="#ffffff"/>
    <text x="95" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="16" fill="#333333">
      Hi, I have Synergy Health insurance.
    </text>
    <text x="95" y="65" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="16" fill="#333333">
      Will this cover my visit today?
    </text>
  </g>
  
  <!-- First AI response -->
  <g>
    <!-- Message background -->
    <rect x="50" y="120" width="300" height="50" rx="25" fill="#1B75BB"/>
    <text x="70" y="143" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="16" fill="#ffffff">
      Hello! Let me check your insurance
    </text>
    <text x="70" y="160" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="16" fill="#ffffff">
      information.
    </text>
    
    <!-- AI avatar -->
    <rect x="355" y="130" width="30" height="30" rx="15" fill="#e8e8f5"/>
    <g transform="translate(370, 145)">
      <!-- Bot antenna -->
      <line x1="0" y1="-8" x2="0" y2="-5" stroke="#1B75BB" stroke-width="1"/>
      <circle cx="0" cy="-8" r="1" fill="#1B75BB"/>
      <!-- Bot head -->
      <rect x="-5" y="-3" width="10" height="7" rx="2" fill="#1B75BB"/>
      <!-- Bot eyes -->
      <circle cx="-2" cy="1" r="1" fill="#ffffff"/>
      <circle cx="2" cy="1" r="1" fill="#ffffff"/>
    </g>
  </g>
  
  <!-- Second patient message -->
  <g>
    <!-- User avatar -->
    <rect x="20" y="210" width="50" height="50" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
    <text x="45" y="240" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="24" font-weight="600" fill="#3d3d70" text-anchor="middle">MK</text>
    
    <!-- Message background -->
    <rect x="80" y="220" width="150" height="40" rx="15" fill="#ffffff"/>
    <text x="95" y="245" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="16" fill="#333333">
      Okay, thanks!
    </text>
  </g>
  
  <!-- Second AI response -->
  <g>
    <!-- Message background -->
    <rect x="50" y="290" width="300" height="100" rx="25" fill="#1B75BB"/>
    <text x="70" y="320" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="16" fill="#ffffff">
      Yes, your Synergy Health plan should
    </text>
    <text x="70" y="340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="16" fill="#ffffff">
      cover this visit. However, it's always
    </text>
    <text x="70" y="360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="16" fill="#ffffff">
      good to confirm with your insurance
    </text>
    <text x="70" y="380" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="16" fill="#ffffff">
      provider directly to be sure.
    </text>
    
    <!-- AI avatar -->
    <rect x="355" y="325" width="30" height="30" rx="15" fill="#e8e8f5"/>
    <g transform="translate(370, 340)">
      <!-- Bot antenna -->
      <line x1="0" y1="-8" x2="0" y2="-5" stroke="#1B75BB" stroke-width="1"/>
      <circle cx="0" cy="-8" r="1" fill="#1B75BB"/>
      <!-- Bot head -->
      <rect x="-5" y="-3" width="10" height="7" rx="2" fill="#1B75BB"/>
      <!-- Bot eyes -->
      <circle cx="-2" cy="1" r="1" fill="#ffffff"/>
      <circle cx="2" cy="1" r="1" fill="#ffffff"/>
    </g>
  </g>
</svg>