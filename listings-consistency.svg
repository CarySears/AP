<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="500" fill="#f5f5f5"/>
  
  <!-- Dashboard header -->
  <g>
    <rect x="20" y="30" width="360" height="50" rx="8" fill="#1B75BB"/>
    <text x="200" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="18" font-weight="600" fill="#ffffff" text-anchor="middle">Directory Sync Dashboard</text>
    <text x="200" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" fill="rgba(255,255,255,0.9)" text-anchor="middle">50+ directories synchronized</text>
  </g>
  
  <!-- Status overview -->
  <g>
    <rect x="20" y="90" width="360" height="40" rx="6" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
    <text x="50" y="115" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="14" font-weight="600" fill="#10b981">All listings up to date</text>
  </g>
  
  <!-- Directory grid -->
  <g>
    <!-- Row 1 -->
    <!-- Google -->
    <rect x="30" y="150" width="100" height="70" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
    <text x="80" y="170" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="14" font-weight="600" fill="#4285f4" text-anchor="middle">Google</text>
    <text x="80" y="185" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Business Profile</text>
    <text x="80" y="210" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="10" fill="#10b981" text-anchor="middle">Synced</text>
    
    <!-- Yelp -->
    <rect x="150" y="150" width="100" height="70" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
    <text x="200" y="170" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="14" font-weight="600" fill="#d32323" text-anchor="middle">Yelp</text>
    <text x="200" y="185" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Reviews</text>
    <text x="200" y="210" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="10" fill="#10b981" text-anchor="middle">Synced</text>
    
    <!-- Apple Maps -->
    <rect x="270" y="150" width="100" height="70" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
    <text x="320" y="170" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="14" font-weight="600" fill="#007AFF" text-anchor="middle">Apple Maps</text>
    <text x="320" y="185" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Business Connect</text>
    <text x="320" y="210" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="10" fill="#10b981" text-anchor="middle">Synced</text>
    
    <!-- Row 2 -->
    <!-- Bing -->
    <rect x="30" y="240" width="100" height="70" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
    <text x="80" y="260" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="14" font-weight="600" fill="#0078d4" text-anchor="middle">Bing</text>
    <text x="80" y="275" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Places</text>
    <circle cx="110" cy="250" r="6" fill="#10b981"/>
    <text x="115" y="254" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle">✓</text>
    <text x="80" y="300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="10" fill="#10b981" text-anchor="middle">Synced</text>
    
    <!-- Foursquare -->
    <rect x="150" y="240" width="100" height="70" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
    <text x="200" y="260" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="14" font-weight="600" fill="#f94877" text-anchor="middle">Foursquare</text>
    <text x="200" y="275" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Places</text>
    <circle cx="230" cy="250" r="6" fill="#10b981"/>
    <text x="235" y="254" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle">✓</text>
    <text x="200" y="300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="10" fill="#10b981" text-anchor="middle">Synced</text>
    
    <!-- Yellow Pages -->
    <rect x="270" y="240" width="100" height="70" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
    <text x="320" y="260" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="14" font-weight="600" fill="#ffcc00" text-anchor="middle">Yellow Pages</text>
    <text x="320" y="275" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">YP.com</text>
    <circle cx="350" cy="250" r="6" fill="#10b981"/>
    <text x="355" y="254" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle">✓</text>
    <text x="320" y="300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="10" fill="#10b981" text-anchor="middle">Synced</text>
  </g>
  
  <!-- Plus more indicator -->
  <g>
    <rect x="30" y="330" width="340" height="40" rx="6" fill="rgba(27, 117, 187, 0.1)" stroke="#1B75BB" stroke-width="1" stroke-dasharray="4,4"/>
    <text x="200" y="350" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="14" fill="#1B75BB" text-anchor="middle">+ 194 more directories</text>
    <text x="200" y="365" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Facebook, Tripadvisor, Superpages, DexKnows, and more...</text>
  </g>
  
  <!-- Consistency metrics -->
  <g>
    <rect x="30" y="390" width="160" height="60" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
    <text x="110" y="410" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="24" font-weight="700" fill="#10b981" text-anchor="middle">100%</text>
    <text x="110" y="425" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Data Consistency</text>
    <text x="110" y="440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Across All Platforms</text>
    
    <rect x="210" y="390" width="160" height="60" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
    <text x="290" y="410" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="24" font-weight="700" fill="#1B75BB" text-anchor="middle">50+</text>
    <text x="290" y="425" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Active Directories</text>
    <text x="290" y="440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Automatically Updated</text>
  </g>
  
  <!-- Bottom tagline -->
  <text x="200" y="480" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="14" fill="#1B75BB" text-anchor="middle" font-weight="600">Consistent • Accurate • Everywhere</text>
</svg>