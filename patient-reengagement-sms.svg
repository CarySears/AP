<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="500" fill="#f5f5f5"/>
  
  <!-- Phone mockup -->
  <g>
    <!-- Phone frame -->
    <rect x="75" y="40" width="250" height="420" rx="25" fill="#1a1a1a"/>
    <rect x="85" y="70" width="230" height="360" rx="15" fill="#000000"/>
    
    <!-- Status bar -->
    <rect x="85" y="70" width="230" height="25" fill="#000000"/>
    <text x="95" y="87" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" fill="#ffffff">9:41</text>
    <text x="295" y="87" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" fill="#ffffff" text-anchor="end">100%</text>
    
    <!-- Messages header -->
    <rect x="85" y="95" width="230" height="35" fill="#1B75BB"/>
    <text x="200" y="117" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="16" font-weight="600" fill="#ffffff" text-anchor="middle">Messages</text>
  </g>
  
  <!-- Single professional message -->
  <g>
    <!-- Date separator -->
    <rect x="130" y="180" width="140" height="20" rx="10" fill="#e5e7eb"/>
    <text x="200" y="192" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">6 weeks after last visit</text>
    
    <!-- Message bubble -->
    <rect x="50" y="220" width="300" height="120" rx="15" fill="#1B75BB"/>
    <text x="65" y="245" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" fill="#ffffff">Hi Emily, this is Dr. Martinez from</text>
    <text x="65" y="265" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" fill="#ffffff">Mindful Wellness Center. Just checking</text>
    <text x="65" y="285" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" fill="#ffffff">in to see how you've been doing since</text>
    <text x="65" y="305" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" fill="#ffffff">our last session. Would you like to</text>
    <text x="65" y="325" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" fill="#ffffff">schedule a follow-up?</text>
  </g>
</svg>