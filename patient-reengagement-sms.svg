<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="500" fill="#f5f5f5"/>
  
  <!-- Phone mockup -->
  <g>
    <!-- Phone frame -->
    <rect x="75" y="40" width="250" height="420" rx="25" fill="#1a1a1a"/>
    <rect x="85" y="70" width="230" height="360" rx="15" fill="#000000"/>
    
    <!-- Status bar -->
    <rect x="85" y="70" width="230" height="25" fill="#000000"/>
    <text x="95" y="87" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" fill="#ffffff">9:41</text>
    <text x="295" y="87" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" fill="#ffffff" text-anchor="end">100%</text>
    
    <!-- Messages header -->
    <rect x="85" y="95" width="230" height="35" fill="#1B75BB"/>
    <text x="200" y="117" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="16" font-weight="600" fill="#ffffff" text-anchor="middle">ActionPotential.AI</text>
  </g>
  
  <!-- First message (3 weeks later) -->
  <g>
    <!-- Date separator -->
    <rect x="150" y="150" width="100" height="20" rx="10" fill="#e5e7eb"/>
    <text x="200" y="162" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">3 weeks later</text>
    
    <!-- Message bubble -->
    <rect x="95" y="180" width="200" height="50" rx="15" fill="#1B75BB"/>
    <text x="105" y="200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="14" fill="#ffffff">Hi Sarah! Hope you're doing well.</text>
    <text x="105" y="218" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="14" fill="#ffffff">How are you feeling lately?</text>
  </g>
  
  <!-- Second message (6 weeks later) -->
  <g>
    <!-- Date separator -->
    <rect x="150" y="250" width="100" height="20" rx="10" fill="#e5e7eb"/>
    <text x="200" y="262" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">3 weeks later</text>
    
    <!-- Message bubble -->
    <rect x="95" y="280" width="200" height="70" rx="15" fill="#1B75BB"/>
    <text x="105" y="300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="14" fill="#ffffff">We miss seeing you! Ready to</text>
    <text x="105" y="318" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="14" fill="#ffffff">schedule your next visit?</text>
    
    <!-- Book button -->
    <rect x="105" y="330" width="80" height="15" rx="8" fill="#ffffff"/>
    <text x="145" y="340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="11" fill="#1B75BB" text-anchor="middle" font-weight="600">Book Now</text>
  </g>
  
  <!-- Third message (gentle reminder) -->
  <g>
    <!-- Date separator -->
    <rect x="150" y="370" width="100" height="20" rx="10" fill="#e5e7eb"/>
    <text x="200" y="382" font-family="-apple-system, BlinkMacSystemFont, 'Segue UI', Roboto, Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">2 weeks later</text>
    
    <!-- Message bubble -->
    <rect x="95" y="400" width="200" height="35" rx="15" fill="#79C5C7"/>
    <text x="105" y="420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="14" fill="#ffffff">Take care, Sarah. We're here</text>
    <text x="105" y="430" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="14" fill="#ffffff">when you're ready. 💙</text>
  </g>
  
  <!-- Bottom text -->
  <text x="200" y="470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="14" fill="#1B75BB" text-anchor="middle" font-weight="600">Personalized • Ethical • Effective</text>
</svg>