<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="500" fill="#f5f5f5"/>
  
  <!-- Email header -->
  <g>
    <text x="20" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="14" fill="#333333">
      <tspan font-weight="600">To:</tspan> Sarah Mitchell, James Chen...
    </text>
    <text x="20" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="14" fill="#333333">
      <tspan font-weight="600">Subject:</tspan> Rate our services
    </text>
    
    <!-- Three dots menu -->
    <circle cx="370" cy="30" r="2" fill="#999999"/>
    <circle cx="370" cy="38" r="2" fill="#999999"/>
    <circle cx="370" cy="46" r="2" fill="#999999"/>
  </g>
  
  <!-- Email body section with envelope graphic -->
  <g>
    <!-- Light gray background box -->
    <rect x="20" y="70" width="360" height="130" rx="10" fill="#e8e8e8"/>
    
    <!-- Browser window frame -->
    <rect x="130" y="110" width="140" height="70" rx="4" fill="#ffffff" stroke="#d0d0d0" stroke-width="1"/>
    <rect x="130" y="110" width="140" height="14" rx="4" fill="#f0f0f0"/>
    <!-- Browser dots -->
    <circle cx="137" cy="117" r="2" fill="#ff5f57"/>
    <circle cx="145" cy="117" r="2" fill="#ffbd2e"/>
    <circle cx="153" cy="117" r="2" fill="#28ca42"/>
    
    <!-- Envelope -->
    <g transform="translate(200, 150)">
      <!-- Envelope body -->
      <rect x="-28" y="-14" width="56" height="35" rx="2" fill="#1B75BB"/>
      <!-- Envelope flap -->
      <path d="M -28 -14 L 0 3 L 28 -14 Z" fill="#1B75BB"/>
      <!-- Envelope opening -->
      <rect x="-21" y="-7" width="42" height="2" fill="#ffffff"/>
      
      <!-- Star badge -->
      <circle cx="21" cy="14" r="14" fill="#ffa500"/>
      <path d="M 21 7 L 23 12.6 L 28.7 12.6 L 24.5 15.9 L 26.5 21.7 L 21 18.3 L 15.5 21.7 L 17.5 15.9 L 13.3 12.6 L 19 12.6 Z" fill="#ffffff"/>
    </g>
    
    <!-- Radiating lines from envelope -->
    <g transform="translate(200, 150)" opacity="0.3">
      <line x1="0" y1="-28" x2="0" y2="-38" stroke="#666666" stroke-width="1.5"/>
      <line x1="21" y1="-21" x2="28" y2="-28" stroke="#666666" stroke-width="1.5"/>
      <line x1="28" y1="0" x2="38" y2="0" stroke="#666666" stroke-width="1.5"/>
      <line x1="-21" y1="-21" x2="-28" y2="-28" stroke="#666666" stroke-width="1.5"/>
      <line x1="-28" y1="0" x2="-38" y2="0" stroke="#666666" stroke-width="1.5"/>
    </g>
  </g>
  
  <!-- Main text -->
  <text x="200" y="240" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="28" font-weight="600" fill="#1B75BB" text-anchor="middle">
    We'd love to hear
  </text>
  <text x="200" y="270" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="28" font-weight="600" fill="#1B75BB" text-anchor="middle">
    from you!
  </text>
  
  <!-- Subtext -->
  <text x="200" y="300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" fill="#666666" text-anchor="middle">
    Do you have 1 more quick minute to share your
  </text>
  <text x="200" y="315" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" fill="#666666" text-anchor="middle">
    feedback with our team or on these review sites?
  </text>
  
  <!-- Review button -->
  <g>
    <rect x="100" y="340" width="200" height="35" rx="18" fill="#1B75BB"/>
    
    <!-- Google icon -->
    <text x="115" y="362" font-family="Arial, sans-serif" font-size="16" font-weight="500" fill="#4285F4" text-anchor="middle">G</text>
    
    <text x="200" y="363" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" font-weight="500" fill="#ffffff" text-anchor="middle">
      Review Us On Google
    </text>
  </g>
</svg>